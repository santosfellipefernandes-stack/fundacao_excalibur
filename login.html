<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORÁCULO // Acesso Restrito</title>
  <link rel="stylesheet" href="login.css">
</head>

<body class="login-body">

  <main class="login-page">

    <!-- Tela inicial de verificação -->
    <section class="boot-screen" id="bootScreen">
      <div class="terminal-box">
        <div class="terminal-header">
          <span class="terminal-dot"></span>
          <span>GNN ANALYTICS NETWORK</span>
        </div>

        <div class="terminal-content" id="terminalContent">
          <!-- O login.js vai escrever as linhas aqui -->
        </div>
      </div>
    </section>

    <!-- Tela de login, escondida no começo -->
    <section class="login-screen" id="loginScreen">
      <div class="login-card">

        <div class="system-label">FUNDAÇÃO EXCALIBUR</div>

        <h1>ORÁCULO</h1>

        <p class="subtitle">
          Sistema interno de análise, previsão e catalogação de ocorrências paranormais.
        </p>

        <div class="access-warning">
          ACESSO RESTRITO // CREDENCIAIS NECESSÁRIAS
        </div>

        <form id="loginForm">
          <label for="agentCode">Código de Agente</label>
          <input type="text" id="agentCode" placeholder="Ex: AGT-0001" autocomplete="off">

          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Chave de acesso">

          <button type="submit">AUTENTICAR</button>
        </form>

        <p id="loginMessage" class="login-message"></p>

        <a href="index.html" class="back-link">← Retornar à GNN</a>

      </div>
    </section>

  </main>

  <script src="login.js"></script>
</body>
</html>
